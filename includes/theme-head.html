<script>
  (() => {
    const storageKey = "steele-theme";
    const validPreferences = new Set(["light", "dark", "auto"]);
    let preference = "auto";

    try {
      const savedPreference = window.localStorage.getItem(storageKey);
      if (validPreferences.has(savedPreference)) preference = savedPreference;
    } catch (_) {
      // Storage can be unavailable in privacy-restricted browsing contexts.
    }

    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    const resolvedTheme = preference === "auto"
      ? (prefersDark ? "dark" : "light")
      : preference;

    document.documentElement.dataset.theme = resolvedTheme;
    document.documentElement.dataset.themePreference = preference;
    document.documentElement.style.colorScheme = resolvedTheme;
  })();
</script>
<script src="/js/theme.js" defer></script>
